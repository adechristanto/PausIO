[workspace]
members = [
  "crates/pausio-protocol",
  "crates/pausio-core",
  "plugins/tauri-plugin-eyecare",
  "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["PausIO Contributors"]
homepage = "https://github.com/adechristanto/PausIO"
repository = "https://github.com/adechristanto/PausIO"
rust-version = "1.93.0"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
iana-time-zone = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
