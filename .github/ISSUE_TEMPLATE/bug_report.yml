name: Bug report
description: Something is not working correctly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing a bug, check [open issues](https://github.com/adechristanto/PausIO/issues) to see if it has been reported already.

        **Do not report security vulnerabilities here.** Use [private vulnerability reporting](https://github.com/adechristanto/PausIO/security/advisories/new) instead.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
        - iOS
        - Android
        - Apple Watch
        - Wear OS
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      description: 'e.g. macOS 15.2, Windows 11 24H2, Ubuntu 24.04'
    validations:
      required: true

  - type: input
    id: desktop-env
    attributes:
      label: Desktop environment (Linux only)
      description: 'e.g. GNOME 47 X11, KDE Plasma 6 Wayland. Leave blank on macOS/Windows.'

  - type: input
    id: tray-host
    attributes:
      label: Tray host (Linux only)
      description: 'e.g. KDE system tray, GNOME AppIndicator extension, none'

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open PausIO settings
        2. Set strictness to Strict
        3. Wait for a break to become due
        4. …
    validations:
      required: true

  - type: textarea
    id: health-report
    attributes:
      label: Health report
      description: |
        On desktop, open PausIO → Settings → scroll to the bottom → Copy health report. Paste it here.
        This contains only PausIO timer state and platform capability information — no personal data.
      render: json

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Logs, screenshots, or additional context.
