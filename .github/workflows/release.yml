name: Release candidate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag (for example v0.1.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag_name || github.ref }}
  cancel-in-progress: false

# Build jobs are read-only. Only the final job may create or update a release.
permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Validate release tag
        shell: bash
        run: |
          tag='${{ inputs.tag_name || github.ref_name }}'
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must follow vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check && pnpm test && pnpm build
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: pnpm audit --prod --audit-level high

  desktop:
    name: Desktop candidate (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            bundles: app,dmg
          - name: Windows
            os: windows-2025
            bundles: nsis,msi
          - name: Linux
            os: ubuntu-24.04
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pausio-${{ matrix.name }}-unsigned
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  android:
    name: Android and Wear OS candidate
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.93.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "ndk;28.2.13676358"
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:mobile
      - name: Build Android phone release APK
        run: pnpm tauri android build --apk --target aarch64,armv7,x86_64 --ci
      - name: Build Wear OS release APK
        working-directory: src-tauri/gen/android
        run: ./gradlew :wear:assembleRelease --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pausio-android-unsigned
          path: |
            src-tauri/gen/android/**/build/outputs/apk/**/release/*.apk
          if-no-files-found: error

  ios:
    name: iOS candidate
    needs: verify
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.93.0
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: brew install xcodegen
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:mobile
      - name: Build unsigned iOS archive
        working-directory: src-tauri/gen/apple
        run: |
          xcodebuild -project PausIO.xcodeproj \
            -scheme PausIO_iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PausIO.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -R build/PausIO.xcarchive/Products/Applications/*.app Payload/
          zip -r PausIO_iOS_unsigned.ipa Payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pausio-ios-unsigned
          path: src-tauri/gen/apple/PausIO_iOS_unsigned.ipa
          if-no-files-found: error

  draft-release:
    name: Create private draft release
    needs: [desktop, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: release-assets/**/*
          draft: true
          prerelease: true
          generate_release_notes: true
          body: |
            Automated unsigned release candidate. Do not publish this draft until
            platform signing, notarization, physical-device checks, and the manual
            release checklist in docs/RELEASE_PIPELINE.md are complete.
